[project]
name = "ragdx"
version = "0.1.0"
description = "Attributing RAG failures: controlled-condition (No/Gold/Retrieved) diagnosis with validated ground truth"
requires-python = ">=3.10"
dependencies = [
    "groq>=0.13",
    "datasets>=2.21",
    "scikit-learn>=1.6",
    "pydantic>=2.10",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
